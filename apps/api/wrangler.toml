name = "dropshiping2bizbize-api"
main = "src/worker.ts"
compatibility_date = "2026-03-20"
# Bu repo hedef Cloudflare hesabina tasinmistir.
# Dogru hesaba deploy guvencesi icin account_id alanini hedef hesap ID'si ile doldurun:
account_id = "102eaec87235c67e6d7524d859bd92dd"

[[d1_databases]]
binding = "DB"
database_name = "dropshiping2bizbize-prod"
database_id = "aab63623-ff50-4109-b927-e2fff3f45fbc"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "PROMPT_IMAGES"
bucket_name = "dropshiping2bizbize-prompt-images"

[[queues.producers]]
binding = "REFRESH_QUEUE"
queue = "dropshiping2bizbize-refresh"

[[queues.consumers]]
queue = "dropshiping2bizbize-refresh"
max_batch_size = 25
max_batch_timeout = 30

[triggers]
crons = ["0 * * * *"]

[env.dev]
name = "dropshiping2bizbize-api-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "dropshiping2bizbize-dev"
database_id = "ea8b4312-d2f8-47d0-91bd-8b10745c47ff"
migrations_dir = "drizzle"

[[env.dev.r2_buckets]]
binding = "PROMPT_IMAGES"
bucket_name = "dropshiping2bizbize-prompt-images-dev"

[[env.dev.queues.producers]]
binding = "REFRESH_QUEUE"
queue = "dropshiping2bizbize-refresh-dev"

[[env.dev.queues.consumers]]
queue = "dropshiping2bizbize-refresh-dev"
max_batch_size = 25
max_batch_timeout = 30

[env.dev.triggers]
crons = []

