name = "trendyol-etsy-api"
main = "src/worker.ts"
compatibility_date = "2026-03-20"

[[d1_databases]]
binding = "DB"
database_name = "trendyol-etsy"
database_id = "local-trendyol-etsy-db"

[[queues.producers]]
binding = "REFRESH_QUEUE"
queue = "trendyol-refresh"

[[queues.consumers]]
queue = "trendyol-refresh"
max_batch_size = 25
max_batch_timeout = 30

[triggers]
crons = ["0 * * * *"]
